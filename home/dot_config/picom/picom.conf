# picom 13: only the settings that differ from picom's defaults; the rest: man picom.
# i3 starts it with `picom -b` (autostart). `picom --diagnostics` checks this file.

backend = "glx";                  # OpenGL (needed for the blur); required since v12
vsync = true;                     # no tearing

# --- Shadows ------------------------------------------------------------------------
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.6;

# --- Blur ---------------------------------------------------------------------------
# Blurs what shows through see-through windows (the menus below, transparent
# backgrounds). Setting a method is what turns it on.
blur: { method = "dual_kawase"; };

# --- Fading -------------------------------------------------------------------------
# Workspace switches (and the scratchpad) crossfade: 1/0.03 steps x 4 ms = 133 ms, in
# and out (fade-out-step is 0.03 by default). Windows open and close at once.
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
no-fading-openclose = true;

# i3 doesn't copy a window's opacity property onto its frame: read it from the window.
detect-client-opacity = true;

# --- Window rules -------------------------------------------------------------------
# Matched in order; a later rule wins. `picom-inspect` shows what matches a window
# (click on it). With rules set, the old per-option lists (shadow-exclude, wintypes,
# ...) are ignored, and picom warns about them.
rules = (
  # Menus and tooltips: slightly see-through, over the blurred background
  { match = "window_type = 'tooltip' || window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    opacity = 0.9; },
  # The bar (polybar) and drag-and-drop icons
  { match = "window_type = 'dock' || window_type = 'dnd'"; shadow = false; },
  # GTK windows that draw their own frame and shadow (client-side decorations)
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; blur-background = false; },
  # The 3D printer slicers
  { match = "class_g = 'OrcaSlicer' || name *= 'OrcaSlicer' || class_g = 'BambuStudio' || name *= 'BambuStudio'";
    shadow = false; },
);
