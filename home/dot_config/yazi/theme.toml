# yazi colors: only what differs from yazi's theme. Every color is one of the
# terminal's 16, so kitty's theme (theme-switcher: Ayu light or mirage) decides.

[mgr]
# yazi's "gray" is ANSI 7, which is white in Ayu light: the borders vanished there.
border_style = { fg = "darkgray" }

# The status bar and tabs put blue text on ANSI 7, which is unreadable in Ayu mirage
# (light blue on light gray). Here: black on the mode color, and the mode color on
# black, readable in both themes.
[mode]
normal_main = { fg = "black", bg = "blue", bold = true }
normal_alt  = { fg = "blue", bg = "black" }
select_main = { fg = "black", bg = "red", bold = true }
select_alt  = { fg = "red", bg = "black" }
unset_main  = { fg = "black", bg = "red", bold = true }
unset_alt   = { fg = "red", bg = "black" }

[tabs]
active   = { fg = "black", bg = "blue", bold = true }
inactive = { fg = "blue", bg = "black" }
