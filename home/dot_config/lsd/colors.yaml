# lsd colors: only the ones that differ from lsd's default theme. Named colors
# (dark_green, …) follow the terminal's palette; numbers are fixed 256-color codes.
# lsd's defaults 230/187 for owner and group are near-white, invisible on a light
# background.
user: dark_green
group: dark_red
size:
  none: 190
  small: 184
  medium: 178
  large: 160
