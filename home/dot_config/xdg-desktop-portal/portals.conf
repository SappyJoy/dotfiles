# Portal backends in this account's sessions (i3, and the X WMs of the tour),
# written down as they are picked today. Generic, not i3-portals.conf: the user
# manager that runs xdg-desktop-portal never gets XDG_CURRENT_DESKTOP, so a file
# named for a desktop is never read. Without a config, xdg-desktop-portal falls
# back to gtk on its own; this keeps it so if that rule changes.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
