# kitty: only the settings that differ from kitty's defaults; the rest, with docs:
# https://sw.kovidgoyal.net/kitty/conf/ (or ctrl+shift+f2 opens this file in kitty).

# Colors: theme.conf includes themes/ayu_light.conf or ayu_mirage.conf. It's seeded
# once by chezmoi (create_), then theme-switcher rewrites it.
include ./theme.conf

# Explicit weights: with `auto`, kitty picks JetBrainsMono's SemiBold for bold.
font_family      JetBrainsMono NF
bold_font        JetBrainsMono NF Bold
italic_font      JetBrainsMono NF Italic
bold_italic_font JetBrainsMono NF Bold Italic
font_size 9

term xterm-256color
