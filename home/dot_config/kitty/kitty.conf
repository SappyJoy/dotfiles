# kitty: only the settings that differ from kitty's defaults; the rest, with docs:
# https://sw.kovidgoyal.net/kitty/conf/ (or ctrl+shift+f2 opens this file in kitty).

# Colors: theme.conf includes themes/ayu_light.conf or ayu_mirage.conf. It's seeded
# once by chezmoi (create_), then theme-switcher rewrites it.
include ./theme.conf

# Explicit weights: with `auto`, kitty picks JetBrainsMono's SemiBold for bold.
font_family      JetBrainsMono NF
bold_font        JetBrainsMono NF Bold
italic_font      JetBrainsMono NF Italic
bold_italic_font JetBrainsMono NF Bold Italic
font_size 9


# No sound on a bell (from the shell, a TUI, or passed on by tmux). A bell in a
# background window still marks it urgent in i3 (window_alert_on_bell).
enable_audio_bell no

# A short trail when the cursor jumps far: easy to spot on a window spanning three
# monitors. Only for cursors that stayed put for 3 ms, so busy TUIs don't smear.
cursor_trail 3

# Shift+Enter and Ctrl+Enter as CSI u codes, which tmux reads (extended-keys) and
# passes on to programs that ask (nvim's notebooks run cells with them). kitty itself
# sends both as a plain Enter unless a program asks through kitty's own keyboard
# protocol, and tmux asks only through xterm's modifyOtherKeys, which kitty doesn't
# support. Outside tmux, a program that knows neither gets the code, not an Enter.
map shift+enter send_text all \x1b[13;2u
map ctrl+enter send_text all \x1b[13;5u
