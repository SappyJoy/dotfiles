# tmux 3.7. Only what differs from tmux's defaults, grouped by role.

# --- Terminal -----------------------------------------------------------------------
set -sg escape-time 0                         # Esc reaches nvim at once
set -as terminal-features ",xterm*:RGB"       # true color from kitty and xterm-likes
set -as terminal-features ",xterm-kitty:extkeys" # kitty sends modified keys…
set -s extended-keys on                       # …and tmux passes them to programs that ask
set -s extended-keys-format csi-u             # (nvim: Shift+Enter, Ctrl+Enter in notebooks)
set -gq allow-passthrough on                  # image.nvim draws through to kitty
set -g focus-events on                        # lets nvim notice focus (autoread)

# --- Behavior -----------------------------------------------------------------------
set -g mouse on
set -g base-index 1                           # windows and panes count from 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g display-time 4000                      # messages stay 4 s
set -g status-keys emacs                      # the : prompt (tmux picks vi from EDITOR)
setw -g aggressive-resize on
# Window names: the title the program sets (nvim does), else the command
setw -g automatic-rename-format '#{?pane_title,#{pane_title},#{pane_current_command}}'

# --- Windows and panes --------------------------------------------------------------
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind C-p previous-window
bind C-n next-window
bind-key -n M-n previous-window
bind-key -n M-o next-window
bind-key -n S-Left swap-window -d -t -1
bind-key -n S-Right swap-window -d -t +1
bind-key b set-option status                  # hide/show the status bar

# Pane moves with Ctrl+arrows (and Ctrl+\ for the last pane), shared with nvim: in an
# nvim pane the key goes to nvim, whose vim-tmux-navigator moves on to tmux.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-Left' if-shell "$is_vim" 'send-keys C-Left'  'select-pane -L'
bind-key -n 'C-Down' if-shell "$is_vim" 'send-keys C-Down'  'select-pane -D'
bind-key -n 'C-Up' if-shell "$is_vim" 'send-keys C-Up'  'select-pane -U'
bind-key -n 'C-Right' if-shell "$is_vim" 'send-keys C-Right'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi 'C-Left' select-pane -L
bind-key -T copy-mode-vi 'C-Down' select-pane -D
bind-key -T copy-mode-vi 'C-Up' select-pane -U
bind-key -T copy-mode-vi 'C-Right' select-pane -R

# Keep the top-level pane columns on the monitor borders when the terminal spans
# several monitors (FILM, see film-snap); a no-op elsewhere or without film-snap.
set-hook -g after-split-window 'run-shell -b "~/.local/bin/film-snap tmux #{window_id} >/dev/null 2>&1 || true"'
set-hook -g after-kill-pane 'run-shell -b "~/.local/bin/film-snap tmux #{window_id} >/dev/null 2>&1 || true"'
set-hook -g pane-exited 'run-shell -b "~/.local/bin/film-snap tmux #{window_id} >/dev/null 2>&1 || true"'
set-hook -g client-resized 'run-shell -b "~/.local/bin/film-snap tmux #{window_id} >/dev/null 2>&1 || true"'

# --- Copy mode ----------------------------------------------------------------------
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# y copies and stays in copy mode. tmux also hands every copy to the terminal
# (OSC 52), so it reaches the clipboard where xclip is missing (ssh, WSL).
bind-key -T copy-mode-vi y send -X copy-pipe 'xclip -in -selection clipboard'

# --- Status bar ---------------------------------------------------------------------
set -g status-interval 1
set -g @minimal-tmux-bg "#FA8D3F"
source-file -q ~/.config/tmux/theme.conf      # theme-switcher writes the color
# minimal-tmux-status, a chezmoi external (.chezmoiexternal.toml.tmpl)
run ~/.tmux/plugins/minimal-tmux-status/minimal.tmux
