# image.nvim
set -gq allow-passthrough on

# Faster movement
set -sg escape-time 0

# True colors
set-option -sa terminal-overrides ",xterm*:Tc"

# mouse support
set -g mouse on

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# What tmux-sensible used to set
set -g history-limit 50000
set -g display-time 4000     # messages stay 4 s
set -g focus-events on       # lets nvim notice focus (autoread) inside tmux
set -g status-keys emacs     # the : prompt; tmux picks vi keys when EDITOR is vi-ish
setw -g aggressive-resize on
bind C-p previous-window
bind C-n next-window

# Status bar colors for minimal-tmux-status (run at the end)
set -g @minimal-tmux-bg "#FA8D3F"
source-file -q ~/.config/tmux/theme.conf  # theme-switcher writes it

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# In copy mode (vi), make 'y' copy selection without exiting copy mode
bind-key -T copy-mode-vi y send -X copy-pipe 'xclip -in -selection clipboard'

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Keep the top-level pane columns on the monitor borders when the terminal spans
# several monitors (FILM, see film-snap); a no-op elsewhere or without film-snap.
set-hook -g after-split-window 'run-shell -b "~/.local/bin/film-snap tmux #{window_id} >/dev/null 2>&1 || true"'
set-hook -g after-kill-pane 'run-shell -b "~/.local/bin/film-snap tmux #{window_id} >/dev/null 2>&1 || true"'
set-hook -g pane-exited 'run-shell -b "~/.local/bin/film-snap tmux #{window_id} >/dev/null 2>&1 || true"'
set-hook -g client-resized 'run-shell -b "~/.local/bin/film-snap tmux #{window_id} >/dev/null 2>&1 || true"'

bind-key -n S-Left swap-window -d -t -1
bind-key -n S-Right swap-window -d -t +1
bind-key -n M-n previous-window
bind-key -n M-o next-window

set -g status-interval 1


# setw -g automatic-rename-format '#I:#(bash -c "p=#{pane_current_path}; echo \\$(basename \\$(dirname \\"\\$p\\"))/\\$(basename \\"\\$p\\")")'
# setw -g automatic-rename on

# Enable automatic renaming of windows
setw -g automatic-rename on

# Define a smart format for window names:
# 1. If the application (like nvim) sets a dynamic title, use that title.
# 2. Otherwise, fall back to the current running command and the basename of the current path.
# setw -g automatic-rename-format '#{?pane_title,#{pane_title},#{pane_current_command} | #{b:pane_current_path}}'

# Optional: You can also use a shorter format if you prefer just the context:
setw -g automatic-rename-format '#{?pane_title,#{pane_title},#{pane_current_command}}'

bind-key b set-option status

# Pane moves with Ctrl+arrows (and Ctrl+\ for the last pane), shared with nvim: in an
# nvim pane the key goes to nvim, whose vim-tmux-navigator moves on to tmux.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-Left' if-shell "$is_vim" 'send-keys C-Left'  'select-pane -L'
bind-key -n 'C-Down' if-shell "$is_vim" 'send-keys C-Down'  'select-pane -D'
bind-key -n 'C-Up' if-shell "$is_vim" 'send-keys C-Up'  'select-pane -U'
bind-key -n 'C-Right' if-shell "$is_vim" 'send-keys C-Right'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# Optional: bind also for copy-mode-vi so you can navigate even when selecting text
bind-key -T copy-mode-vi 'C-Left' select-pane -L
bind-key -T copy-mode-vi 'C-Down' select-pane -D
bind-key -T copy-mode-vi 'C-Up' select-pane -U
bind-key -T copy-mode-vi 'C-Right' select-pane -R

# The status bar: a chezmoi external (.chezmoiexternal.toml.tmpl)
run ~/.tmux/plugins/minimal-tmux-status/minimal.tmux
