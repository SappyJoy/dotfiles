[settings]
screenchange-reload = true
pseudo-transparency = true

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
;   Colors & Aesthetics (Dynamic)
;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Import dynamic colors (Managed by ~/.local/bin/theme-switcher)
include-file = ~/.config/polybar/colors.ini

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
;   Bar Configuration
;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[bar/base]
; Add this line to fix the fullscreen issue
wm-restack = i3

override-redirect = true
width = 99.6%
height = 22
offset-y = 8
offset-x = 0.2%
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}
border-size = 2
border-color = ${colors.background}

padding = 2
module-margin = 2

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=12;3"

modules-left = i3
modules-center = date
modules-right = filesystem cpu memory network pulseaudio tray powermenu

cursor-click = pointer


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
;   Bars: launch.sh starts one per monitor (MONITOR=<name>). Only one tray can
;   exist, so it sits on the primary monitor's bar (FILM has just one bar).
;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[bar/main]
inherit = bar/base
monitor = ${env:MONITOR:}
modules-right = filesystem cpu memory network pulseaudio powermenu

[bar/main-primary]
inherit = bar/main
modules-right = filesystem cpu memory network pulseaudio tray powermenu

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
;   Module Definitions
;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
fuzzy-match = true

format = <label-state> <label-mode>

; Default label colors
label-mode-padding = 1
label-mode-background = ${colors.primary}
label-mode-foreground = ${colors.background}

; Focused: Explicitly set fg/bg to ensure visibility
label-focused = %index%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}
label-focused-padding = 2

; Unfocused
label-unfocused = %index%
label-unfocused-padding = 2
label-unfocused-foreground = ${colors.disabled}

; Visible (e.g. on other monitor)
label-visible = %index%
label-visible-padding = 2
label-visible-foreground = ${colors.foreground}

; Urgent
label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 5
date = %a, %d %b
time = %H:%M
format = <label>
format-prefix = ""
format-prefix-font = 1
format-prefix-foreground = ${colors.primary}
label = %date% %time%

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
format-mounted = <label-mounted>
format-mounted-prefix = " "
format-mounted-prefix-font = 1
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %free%

[module/cpu]
type = internal/cpu
interval = 1
format = <label>
format-prefix = " "
format-prefix-font = 1
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%
bar-load-width = 10
bar-load-foreground-0 = ${colors.primary}
bar-load-indicator = █
bar-load-fill = ─
; --- FIXED: Added missing bar-load-empty parameter ---
bar-load-empty = ─
bar-load-empty-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = "  "
format-prefix-font = 1
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%
bar-used-width = 10
bar-used-foreground-0 = ${colors.primary}
bar-used-indicator = █
bar-used-fill = ─
; --- FIXED: Added missing bar-used-empty parameter ---
bar-used-empty = ─
bar-used-empty-foreground = ${colors.disabled}


[module/network]
type = internal/network
interface = enp6s0
interval = 3.0
format-connected = <label-connected>

label-connected = "%{F#FA8D3E}↓%{F-} %downspeed% %{F#FA8D3E}↑%{F-} %upspeed%"
label-connected-font = 1

format-disconnected = <label-disconnected>
label-disconnected = "󰖪 "
label-disconnected-font = 1
label-disconnected-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-font = 1
ramp-volume-foreground = ${colors.primary}
label-muted = "󰖁 "
label-muted-font = 1
label-muted-foreground = ${colors.disabled}

; --- FIXED: Added a dedicated tray module for modern Polybar versions ---
[module/tray]
type = internal/tray
background = ${colors.background}
padding = 4
tray-spacing = 8px


; This module is unused on a desktop but kept for reference
[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
label-charging = %percentage%%
label-discharging = %percentage%%
format-full = <label-full>
label-full = "󰁹 Full"
label-full-foreground = ${colors.primary}
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁹
ramp-capacity-font = 1
ramp-capacity-foreground = ${colors.primary}
animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰁹
animation-charging-font = 1
animation-charging-foreground = ${colors.primary}
animation-charging-framerate = 750

[module/powermenu]
type = custom/menu
expand-right = true
format-spacing = 1
label-open = "  "
label-open-font = 1
label-open-foreground = ${colors.primary}
label-close = " 󰅙 "
label-close-font = 1
label-close-foreground = ${colors.alert}
menu-0-0 = "Reboot"
menu-0-0-exec = menu-open-1
menu-0-1 = "Power off"
menu-0-1-exec = menu-open-2
menu-1-0 = "Cancel"
menu-1-0-exec = menu-open-0
menu-1-1 = "Reboot"
menu-1-1-exec = reboot
menu-2-0 = "Power off"
menu-2-0-exec = poweroff
menu-2-1 = "Cancel"
menu-2-1-exec = menu-open-0
