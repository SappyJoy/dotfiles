; polybar 3.7: only the settings that differ from polybar's defaults; the rest:
; https://github.com/polybar/polybar/wiki. i3 runs launch.sh on start and restart.

[settings]
; Restart the bar when the monitor layout changes
screenchange-reload = true

; Colors: seeded once by chezmoi (Ayu light), then theme-switcher rewrites them
; (light/dark) and restarts the bar
include-file = ~/.config/polybar/colors.ini

[bar/base]
; A floating strip at the top. i3 doesn't manage it (override-redirect), so i3's
; `gaps top` keeps windows clear of it; wm-restack lets fullscreen windows cover it.
override-redirect = true
wm-restack = i3
width = 99.6%
height = 22
offset-x = 0.2%
offset-y = 8

background = ${colors.background}
foreground = ${colors.foreground}
; A border in the background color: room around the modules
border-size = 2
border-color = ${colors.background}
padding = 2
module-margin = 2

font-0 = "JetBrainsMono Nerd Font:size=10;2"

modules-left = i3
modules-center = date
modules-right = layout filesystem cpu cpu-temp memory gpu network wireguard vless dnd pulseaudio powermenu

cursor-click = pointer

; launch.sh starts one bar per monitor (MONITOR=<name>). Only one tray can exist, so
; it sits on the primary monitor's bar (FILM has just one bar).
[bar/main]
inherit = bar/base
monitor = ${env:MONITOR:}

[bar/main-primary]
inherit = bar/main
modules-right = layout filesystem cpu cpu-temp memory gpu network wireguard vless dnd pulseaudio tray powermenu

[module/i3]
type = internal/i3
; This monitor's workspaces only, in number order; no switching by scrolling
pin-workspaces = true
index-sort = true
enable-scroll = false

label-mode-padding = 1
label-mode-background = ${colors.primary}
label-mode-foreground = ${colors.background}

label-focused = %index%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.disabled}
label-unfocused-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 5
date = %a, %d %b
time = %H:%M
label = %date% %time%

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %free%

[module/cpu]
type = internal/cpu
format-prefix = " "
format-prefix-foreground = ${colors.primary}
; Two digits wide, so the modules to the left don't shift at 10%
label = %percentage:2%%

[module/cpu-temp]
type = custom/script
exec = ~/.config/polybar/scripts/cpu-temp.sh
interval = 5
format-prefix = " "
format-prefix-foreground = ${colors.primary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/gpu]
type = custom/script
exec-if = command -v nvidia-smi
exec = ~/.config/polybar/scripts/gpu.sh
interval = 5
format-prefix = "󰢮 "
format-prefix-foreground = ${colors.primary}

[module/network]
type = internal/network
; The first wired port that is up (skips docker0, the VPN and the TUN)
interface-type = wired
interval = 3
; Orange arrows (a label can't use ${colors.x}, so the color is fixed)
label-connected = "%{F#FA8D3E}↓%{F-} %downspeed% %{F#FA8D3E}↑%{F-} %upspeed%"
label-disconnected = "󰖪 "
label-disconnected-foreground = ${colors.disabled}

; The tunnels, one at a time (vpn-setup): bright while up, dim while down; a click
; toggles. Each shows only where it is set up.
; WireGuard: NetworkManager's connection vpnconfig
[module/wireguard]
type = custom/script
exec-if = nmcli -g NAME connection show | grep -qx vpnconfig
exec = test -e /sys/class/net/vpnconfig && echo WireGuard
interval = 2
format-foreground = ${colors.primary}
format-fail = <label-fail>
format-fail-foreground = ${colors.disabled}
label-fail = WireGuard
click-left = toggle-wireguard

; VLESS: sing-box's tunnel, the vless system service
[module/vless]
inherit = module/wireguard
exec-if = test -e /etc/systemd/system/vless.service
exec = systemctl is-active -q vless && echo VLESS
label-fail = VLESS
click-left = toggle-vless

[module/layout]
type = internal/xkeyboard
format-prefix = "󰌌 "
format-prefix-foreground = ${colors.primary}
; EN / RU; another layout shows its own name (%icon% is filled in before %layout%)
label-layout = %icon%
layout-icon-default = %layout%
layout-icon-0 = us;EN
layout-icon-1 = ru;RU
; Of the lock keys only Caps Lock, and only while it's on
blacklist-0 = num lock
blacklist-1 = scroll lock
label-indicator-on-capslock = CAPS
label-indicator-on-capslock-foreground = ${colors.alert}

; Do not disturb: a bell while dunst is paused (Ctrl+$mod+n), nothing otherwise; a
; click resumes
[module/dnd]
type = custom/script
exec-if = command -v dunstctl
exec = [ "$(dunstctl is-paused)" = true ] && echo 󰂛 || echo
interval = 2
format-foreground = ${colors.primary}
click-left = dunstctl set-paused false

[module/pulseaudio]
type = internal/pulseaudio
; Stop at 100%, not at the 153% pavucontrol allows
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.primary}
label-muted = "󰖁 "
label-muted-foreground = ${colors.disabled}

[module/tray]
type = internal/tray
tray-spacing = 8px

; Reboot and power off, each behind a Cancel/confirm step. Lock, suspend and
; monitors off are i3 keys (Ctrl+$mod+l/s/m).
[module/powermenu]
type = custom/menu
format-spacing = 1
label-open = "  "
label-open-foreground = ${colors.primary}
label-close = " 󰅙 "
label-close-foreground = ${colors.alert}
menu-0-0 = "Reboot"
menu-0-0-exec = menu-open-1
menu-0-1 = "Power off"
menu-0-1-exec = menu-open-2
menu-1-0 = "Cancel"
menu-1-0-exec = menu-open-0
menu-1-1 = "Reboot"
menu-1-1-exec = reboot
menu-2-0 = "Power off"
menu-2-0-exec = poweroff
menu-2-1 = "Cancel"
menu-2-1-exec = menu-open-0
