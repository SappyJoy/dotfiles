# btop's first config: only my choices. btop fills in the rest and saves its full
# config on exit (screen state too: sort order, shown boxes), so from then on the
# file is btop's own and chezmoi doesn't touch it.

# Ayu with its own background, readable in both kitty themes. btop's themes are fixed
# colors; its 16-color "TTY" theme draws text in color 7, white in Ayu light.
# Off arch, the theme file comes from .chezmoiexternal (mise's btop can't find its own).
color_theme = "ayu"

# Graphs update every 0.5 s instead of 2 s.
update_ms = 500

# Disks as big read/write graphs instead of usage bars.
io_mode = true

# The GPU box too (NVIDIA through NVML); btop leaves it out where there's no GPU.
shown_boxes = "cpu mem net proc gpu0"
