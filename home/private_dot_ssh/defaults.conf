# Settings for every host, on every machine. ~/.ssh/config includes this file at its
# end (chezmoi keeps the Include there), and ssh takes the first value it finds: a
# host block in ~/.ssh/config can override any of these.
# Only options OpenSSH 8.2 knows (Ubuntu 20.04): an unknown one is an error there.
# TERM for remote hosts isn't set here but in the fish `ssh` wrapper.

Host *
	# The first use of a key asks for its passphrase once, then the agent holds it.
	# No effect where no agent runs.
	AddKeysToAgent yes
