# Settings for every host, on every machine. ~/.ssh/config includes this file at its
# end (chezmoi keeps the Include there), and ssh takes the first value it finds: a
# host block in ~/.ssh/config can override any of these.
# Only options OpenSSH 8.2 knows (Ubuntu 20.04): an unknown one is an error there.
# TERM for remote hosts isn't set here but in the fish `ssh` wrapper.

Host *
	# One connection per host, shared: a second shell, scp or git to a host you're
	# already on starts at once, with no new login. It stays up 10 min after its last
	# session. `ssh -O exit HOST` closes it, e.g. when it hangs after a VPN switch;
	# `ssh -S none HOST` opens a separate one (sshd allows 10 sessions per connection).
	ControlMaster auto
	ControlPath ~/.ssh/cm-%C
	ControlPersist 10m
	# An unreachable host fails after 10 s, not after TCP's ~2 min.
	ConnectTimeout 10
	# The first use of a key asks for its passphrase once, then the agent holds it.
	# No effect where no agent runs.
	AddKeysToAgent yes

# sshfs: bulk file traffic on its own connection (on the shared one it would delay
# the keystrokes of your shells), and a reconnect once a dead link is noticed (~45 s):
#   sshfs -o reconnect,ServerAliveInterval=15,ControlPath=none HOST:DIR MOUNTPOINT
