# aider: only my changes. Every option and its default: `aider --help`, or
# https://aider.chat/docs/config/aider_conf.html

# Gemini Flash; aider reads its key from GEMINI_API_KEY (fish's private.fish).
model: gemini/gemini-3-flash-preview

# aider doesn't commit on its own: I read the diff and commit myself, under my name
# only (these two also apply to /commit).
auto-commits: false
attribute-author: false
attribute-committer: false

# Run the repo's pre-commit hooks on aider's commits (default: --no-verify).
git-commit-verify: true

# No shell commands suggested after an edit.
suggest-shell-commands: false
